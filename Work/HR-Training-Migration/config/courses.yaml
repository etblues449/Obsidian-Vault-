# Course catalogue + refresher intervals (CQC-aligned)
# ----------------------------------------------------
# Edit this file to match YOUR mandatory training matrix. Each course has:
#   canonical        - the clean name written to the master sheet
#   interval_months  - how long a completion stays valid (refresher frequency)
#   aliases          - the messy spellings/abbreviations seen on paper/spreadsheets
#
# Intervals below are common UK adult-social-care defaults. CONFIRM against your
# own policy / CQC requirements before relying on them — providers vary, and
# some commission annual refreshers for courses others run every 3 years.

settings:
  # A record is "Expiring Soon" when expiry is within this many days of `today`.
  expiring_soon_days: 60
  # Used when a course is matched but has no interval, or an unknown course is kept.
  default_interval_months: 12
  # Fuzzy course-match confidence (0-100). Below this we DON'T auto-assign a
  # canonical course; the row is routed to the Review sheet instead.
  fuzzy_threshold: 84

courses:
  - canonical: "Safeguarding Adults"
    interval_months: 12
    aliases: ["safeguarding", "safeguarding adults", "adult safeguarding", "sova", "safeguarding adults level 2", "safeguarding lvl 2"]

  - canonical: "Safeguarding Children"
