# ─── INPUTS ─────────────────────────────────────────────────────────────────
binary_sensor:
  - platform: gpio
    name: "Boot Button"
    id: btn_boot
    entity_category: diagnostic
    pin:
      number: GPIO0
      mode:
        input: true
        pullup: true
      inverted: true

  - platform: gpio
    name: "User Button"
    id: btn_user
    entity_category: diagnostic
    pin:
      number: GPIO15
      mode:
        input: true
        pullup: true
      inverted: true

  # ⛔ CORRECTED 2026-08-04: this is NOT unverified — Waveshare DOES publish the EXIO map,
  # in the vendor driver `custom_io_expander_ch32v003` v2.0.0, and this vault captured it
  # on 2026-08-01 (see the hardware guide, "Verification" section):
  #   EXIO 0=TP_RST · 1=LCD_RST · 2=SD_CS · 3=CAM_PWDN · 4=PA_CTRL · 5=BAT_EN ·
  #        6=PWR_LED · 7=CHG_DET · ADC=BAT_ADC
  # So EXIO7 = CHG_DET is CONFIRMED. Expander registers: 0x02 dir · 0x03 out · 0x04 in ·
  # 0x05 PWM · 0x06 ADC · 0x07 RTC. Reset defaults DIR=0xFF (all input), OUT=0x00.
  # The `inverted:` polarity is still an empirical call — flip it if it reads backwards.
  # Board takes a GH1.25 2-pin single-cell 3.7V Li-ion, 2000mAh max (ETA6098 charger).
  # NOTE: J4 has NO reverse-polarity protection — meter it before connecting a pack.
  - platform: gpio
    name: "Charger Connected"
    id: charger_present
    device_class: plug
    entity_category: diagnostic
    pin:
      waveshare_io_ch32v003: io_expander
      number: 7
      mode:
        input: true
      inverted: true

