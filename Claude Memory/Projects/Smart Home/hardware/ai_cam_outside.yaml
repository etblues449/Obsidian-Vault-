# ─── IF YOU ADD AUDIO LATER ─────────────────────────────────────────────────
# The board has the full duplex chain fitted, and the I2C scan confirms both codecs are
# alive: ES8311 mono codec at 0x18 (playback), ES7210 ADC at 0x40 on a dual-microphone
# array, NS4150B class-D amp rated 3W into 4 ohms (the bundled 8-ohm/2W speaker gives
# ~1.5W real). I2S: MCLK GPIO10, BCLK GPIO11, LRCLK GPIO12, DOUT GPIO14, DIN GPIO13.
#
# IMPORTANT: es8311 and es7210 are now CORE ESPHome components (audio_dac/es8311 and
# audio_adc/es7210 — the latter shipped in 2025.2.0). Do NOT copy ai_cam's
# external_components block for them; it is not needed on 2026.x.
# Set amp_enable restore_mode to ALWAYS_ON when you do.
#
# TWO HARD RULES from the ai_cam build, both learned expensively:
#   · ONE i2s_audio bus with speaker and microphone as children. Two buses on the same
#     clock pins is a hard error ("Pin N is used in multiple places").
#   · Speaker `timeout:` MUST be a real value (500ms). `timeout: never` holds the I2S
#     mutex forever and silently kills the microphone — nothing errors, the mic just
#     never starts. No barge-in either way; the bus is one-direction-at-a-time.
#
# Worth noting: the audio path does NOT depend on the camera. Even if the sensor turns
# out to be unusable, this board can still be a working Assist satellite — mic, speaker,
# wake word and assist_satellite.announce/ask_question all work without esp32_camera.
