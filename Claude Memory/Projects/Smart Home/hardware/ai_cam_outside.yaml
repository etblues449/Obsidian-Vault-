# ai_cam_outside.yaml — second Waveshare ESP32-S3-CAM board
# Board: ai_cam_outside @ 192.168.0.201 · HA device "AI CAM 2" · area Landing
#
# This is Elliot's working file as of 2026-08-04, captured into the vault, with three
# corrections applied (each marked ⛔ CORRECTED below). It supersedes the earlier vault
# copy, which was reconstructed from a description rather than from the real file.
#
# ┌──────────────────────────────────────────────────────────────────────────┐
# │ ✅ STATUS 2026-08-19: THE CAMERA WORKS. Verified on hardware.            │
# │                                                                          │
# │ Boot log on .201 at 21:50 shows `Setup esp32_camera took 373ms` with NO  │
# │ ESP_ERR_NOT_SUPPORTED, and dump_config() printing Resolution 800x600 /   │
# │ Pixel Format JPEG / JPEG Quality 12 — lines that only print when         │
# │ esp_camera_init() returned OK. http://192.168.0.201:8080 serves a live   │
# │ MJPEG frame in a browser.                                                │
# │                                                                          │
# │ TWO HYPOTHESES BELOW ARE DEAD — do not act on them:                      │
# │  • "GC2145/GC0308, no JPEG engine, replace the module." Pixel Format     │
# │    JPEG initialised, which REQUIRES a hardware JPEG engine. TEST 1       │
# │    (RGB565) IS MOOT. The module does not need replacing.                 │
# │  • "2026.7.3 regression, downgrade ESPHome." It works ON 2026.7.3.       │
# │                                                                          │
# │ STILL NOT PROVEN: (1) which binary is on the board — the running image   │
# │ self-reports `compiled on 2026-08-02 01:02:49`, so the two 2026-08-04    │
# │ corrections may NOT be in it; check the Device Builder last-install      │
# │ timestamp. (2) The EXIO3 settle delay is verified 2/10, not 10/10 — the  │
# │ original fault was intermittent. A regression to 0x106 means             │
# │ priority: 700 → 620, NOT a hardware swap.                                │
# └──────────────────────────────────────────────────────────────────────────┘
#
# ⚠️ FIRST FLASH OF THIS BOARD MUST BE OVER USB, not OTA, if the board has been
# running non-ESPHome firmware (e.g. the Arduino CameraWebServer experiments) — there is
# no ESPHome OTA responder in that image to accept the push. Hold BOOT, tap RST, release
# BOOT, then flash. Once an ESPHome build is on it, OTA to 192.168.0.201 works normally.
# (Folded in from landing_ai_cam_2.yaml, which this file supersedes — see below.)
#
# ─── HISTORICAL: the 2026-08-04 build failure (resolved, kept for the pattern) ───
# Build failure (Device Builder 1.7.0, ESPHome 2026.7.3, log kept alongside this file as
# ai_cam_outside-install-2026-08-04.log): "WebSocket connection closed" at 16m58s, with
# the log ending at "-- Project sdkconfig file ...". That is the END OF CMAKE CONFIGURE —
# the actual compile had not started. Two jobs were active on the build server.
#
#   → That message is the BROWSER losing the log stream, not proof the build died.
#     Check Build server → jobs before assuming failure.
#   → DO NOT click "cleaning the build files for this device". It discards the sdkconfig
#     and ccache you just spent 16 minutes generating, and makes the next attempt pay it
#     again. The dialog offers it; it is the wrong move here.
#   → Build ONE device at a time. Two concurrent ESP-IDF builds is what puts a 4 GB Green
#     into swap. `compile_process_limit: 1` limits parallelism WITHIN a build, not across.
#   → If it keeps dying, compile off-box on the PC — [[ai_cam-compile-runbook]] exists for
#     exactly this, and OTA reaches .201 with no USB cable.
#
# ─── THE CAMERA PROBLEM ─────────────────────────────────────────────────────
# Boot log from the firmware compiled 2026-08-02:
#
#     [C][esp32_camera:139]:   Resolution: 800x600 (SVGA)
#     [C][esp32_camera:140]:   Pixel Format: JPEG
#     [E][esp32_camera:143]:   Setup Failed: ESP_ERR_NOT_SUPPORTED
#     [E][component:188]:   esp32_camera is marked FAILED
#     [E][esp32_camera_web_server:100]:   Setup Failed        (x2 — consequence, not cause)
#
# ⛔ CORRECTION 2026-08-04 — "the sensor answers on I2C, so it is powered" DOES NOT FOLLOW.
#   A power-gated OV3660 on this board ACKs at 0x3C and returns a GARBAGE PID. That is the
#   documented signature of the EXIO3 cause, not evidence against it:
#     · hardware/Waveshare ESP32-S3-CAM-OV3660 — Arduino IDE Setup (CORRECTED).md:
#       "it will ACK on the I²C bus but return a garbage product ID → 0x106"
#     · sessions/2026-07-23-ai-cam-handoff.md:
#       "Without it: ESP_ERR_NOT_SUPPORTED (sensor ACKs but PID garbage)"
#   0x106 IS ESP_ERR_NOT_SUPPORTED. The conclusion may still be right — R8 (10K pull-down
#   on CAM_PWDN) means an untouched EXIO3 floats LOW = powered — but the 0x3C ACK is
#   consistent with a healthy sensor AND a gated one. It discriminates nothing either way.
#
# ⛔ CORRECTION 2026-08-04 — ESP_ERR_NOT_SUPPORTED has THREE causes, and the log above
#   separates none of them. [C][esp32_camera:139…143] is dump_config() output: it reports
#   the errno and never the reason. The discriminating lines come from the ESP-IDF
#   `camera` tag at DEBUG, earlier in boot:
#       Detected camera at address=0x3c
#       Camera PID=0x…  VER=0x…  MIDL=0x…  MIDH=0x…
#     PID 0x3660           → genuine OV3660, sensor is FINE → it is the ESPHome version
#     PID 0x2145 / 0x0308  → GC2145 / GC0308, no JPEG engine → replace the module
#     PID garbage / 0x0000 → not awake → power (EXIO3) or XCLK
#     "JPEG format is not supported on this sensor" → non-JPEG sensor, confirmed outright
#   READ THAT LINE BEFORE FLASHING ANYTHING. It costs one reboot and zero builds, and it
#   answers in one shot what TEST 1 below only half-answers.
#
# ⛔ CORRECTION 2026-08-04 — esphome/esphome#16926 argues AGAINST the wrong-sensor theory.
#   Read live: it is open, names OV3660 EXPLICITLY as affected, blames "the updated
#   esp-idf framework" in 2026.x, and states "both boards confirmed working with Arduino
#   CameraWebServer example firmware, ruling out hardware faults." It is a version
#   regression report, not a shipped-the-wrong-sensor report.
#
# IF THE SENSOR IS CONFIRMED NON-JPEG: RGB565 will initialise, but
# esp32_camera_web_server cannot serve it — no :8080 for go2rtc, no Frigate from this
# board. The fix is a replacement OV3660/OV5640 module, not config. Every OV3660-specific
# entity below becomes meaningless (the driver silently no-ops set_lenc/set_dcw/etc).
#
# ─── OTHER STANDING NOTES ───────────────────────────────────────────────────
# HA IDENTITY — registered as device "AI CAM 2" in area "Landing". Entity IDs are
#   landing_ai_cam_2_ai_cam_outside_* — NOT ai_cam_outside_*. Verified 2026-08-04:
#       sensor.landing_ai_cam_2_ai_cam_outside_wifi_signal
#       sensor.landing_ai_cam_2_ai_cam_outside_ip_address
#       camera.ai_cam_2_ai_cam_outside
#   The esphome: names below do NOT rename the existing HA device. Renaming the device or
#   moving its area rewrites every entity ID and breaks anything referencing them.
#
# DO NOT REFLASH ai_cam (the living room board) while this is unresolved. It is on an
#   older, working build. esphome/esphome#16926 is still open.

substitutions:
  device_ip: "192.168.0.201"

esphome:
  name: ai_cam_outside
  friendly_name: AI Cam Outside
  # ⛔ CORRECTED 2026-08-04: `min_version: 2026.4.0` REMOVED.
  # It silently blocks the single most likely fix. If the PID line comes back 0x3660 the
  # sensor is fine and the remaining suspect is the ESPHome/esp-idf version (#16926) —
  # and a min_version pin makes a downgrade fail validation instead of building. Do not
  # add it back until the camera is confirmed working.
  name_add_mac_suffix: false
  compile_process_limit: 1     # limits parallelism WITHIN this build, not across builds
  on_boot:
    # EXIO3 settle delay — the boot-race guard. Runs after the gpio switch platform
    # (~priority 800) has driven EXIO3 LOW, and before esp32_camera sets up (~600).
    # The lambda delay is BLOCKING on purpose; an async `delay:` would not work, because
    # setup continues while it waits.
    - priority: 700
      then:
        # ⛔ CORRECTED 2026-08-04: added the idempotent re-assert from the 2026-08-01
        # proposal. Costs nothing, and removes any dependence on switch restore order.
        - switch.turn_off: camera_pwdn
        - lambda: 'delay(300);'
    # Re-apply the sensor registers ESPHome does not own.
    # Safe when the camera failed setup: the script null-checks esp_camera_sensor_get().
    - priority: -100
      then:
        - script.execute: apply_camera_extras

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB          # ESP32-S3R8: 16MB external flash, 8MB stacked octal PSRAM
  framework:
    type: esp-idf
    # ── If the PID reads 0x3660, pin the framework here rather than downgrading all of
    # ESPHome — #16926 blames the esp-idf bump specifically. Read the known-good version
    # off the working ai_cam first (its "ESPHome Version" text sensor); do not guess.
    #   version: recommended
    #   platform_version: 51.03.07

psram:
  mode: octal
  speed: 80MHz

# No SD card on this board, so GPIO43/44 are free and serial logging is fine.
# If you ever add sdmmc here, you MUST set baud_rate: 0 — SD_CMD/SD_D0 sit on U0TXD/U0RXD.
# DEBUG is required to see the ESP-IDF `camera` tag PID line. Do not lower it until the
# camera is resolved.
logger:
  level: DEBUG

api:
  # NOTE: this is the SAME key ai_cam uses. That works — HA stores the key per device —
  # but it means compromising one board exposes the other board's API traffic. To split
  # them, add `api_encryption_key_outside` to secrets.yaml (ESPHome Builder: device ⋮ →
  # generate), point this at it, reflash, and re-add the device in HA.
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  power_save_mode: none
  reboot_timeout: 120s
  manual_ip:
    static_ip: ${device_ip}
    gateway: 192.168.0.1
    subnet: 255.255.255.0
    dns1: 192.168.0.1
  use_address: ${device_ip}
  # No `ap:` / `captive_portal:` — deliberate. That also removes the `ap_fallback_password`
  # secret requirement that was blocking compilation. An open or weak fallback AP next to
  # `web_server: 80` on an outdoor board is an unauthenticated route onto the LAN, and
  # nothing is lost: reboot_timeout + OTA already recover the node.

web_server:
  port: 80

# Free-heap telemetry — worth having on the board you may push to higher resolution.
debug:
  update_interval: 60s

# scan: true is deliberate — it is what identified 0x18/0x24/0x3C/0x40 and ruled out a
# dead sensor. Leave it on until the camera issue is resolved. An occasional boot missing
# 0x3C while the camera streams fine is scan timing, not a fault.
i2c:
  - id: bus_a
    sda: GPIO8
    scl: GPIO7
    scan: true

# ⛔ ADDED 2026-08-04 (from the parallel landing_ai_cam_2 work on master) — REQUIRED FOR
# ANY OFF-BOX COMPILE. PyPI ESPHome tops out at 2026.6.5 and does NOT ship
# `waveshare_io_ch32v003`; only the Green's 2026.7.1 add-on has it. So building this file
# on the PC per the runbook fails at validation with an unknown-component error, and the
# message does not hint at the channel gap. Pinning the OFFICIAL component from the
# esphome repo at tag 2026.7.1 makes the file build on both the Green and the PC.
# Harmless when compiling on the Green. Uncomment for an off-box build:
#
# OFF-BOX BUILDS ONLY — uncomment for `esphome run` on the PC. PyPI ESPHome tops out at
# 2026.6.5 and does NOT ship waveshare_io_ch32v003; the Green's 2026.7.1 add-on does, so
# on-Green builds need nothing here. Leave commented when building on the Green.
# external_components:
#   - source:
#       type: git
#       url: https://github.com/esphome/esphome
#       ref: 2026.7.1
#       path: esphome/components
#     components: [waveshare_io_ch32v003]

waveshare_io_ch32v003:
  - id: io_expander
    address: 0x24
    i2c_id: bus_a

# ─── SENSOR-DRIVER STATE ────────────────────────────────────────────────────
# ESPHome's esp32_camera owns roughly fifteen sensor knobs. These are the ones it
# does NOT own, held in globals so apply_camera_extras can re-assert them after any
# update_camera_parameters() call clobbers them.
globals:
  - id: cam_effect_idx
    type: int
    restore_value: yes
    initial_value: '0'
  - id: cam_wb_idx
    type: int
    restore_value: yes
    initial_value: '0'
  - id: cam_awb_on
    type: bool
    restore_value: yes
    initial_value: 'true'
  - id: cam_awb_gain_on
    type: bool
    restore_value: yes
    initial_value: 'true'
  - id: cam_sharpness_val
    type: int
    restore_value: yes
    initial_value: '0'
  - id: cam_denoise_val
    type: int
    restore_value: yes
    initial_value: '0'
  - id: cam_gain_val
    type: int
    restore_value: yes
    initial_value: '0'
  - id: cam_lenc_on
    type: bool
    restore_value: yes
    initial_value: 'true'
  - id: cam_dcw_on
    type: bool
    restore_value: yes
    initial_value: 'true'
  - id: cam_bpc_on
    type: bool
    restore_value: yes
    initial_value: 'true'
  - id: cam_wpc_on
    type: bool
    restore_value: yes
    initial_value: 'true'
  - id: cam_gma_on
    type: bool
    restore_value: yes
    initial_value: 'true'
  - id: cam_colorbar_on
    type: bool
    restore_value: yes
    initial_value: 'false'

script:
  - id: apply_camera_extras
    mode: restart
    then:
      - delay: 150ms
      - lambda: |-
          sensor_t *s = esp_camera_sensor_get();
          if (s == nullptr) return;   // also the guard for "camera failed setup"
          s->set_special_effect(s, id(cam_effect_idx));
          s->set_wb_mode(s, id(cam_wb_idx));
          s->set_whitebal(s, id(cam_awb_on));
          s->set_awb_gain(s, id(cam_awb_gain_on));
          s->set_sharpness(s, id(cam_sharpness_val));
          s->set_denoise(s, id(cam_denoise_val));
          s->set_agc_gain(s, id(cam_gain_val));
          s->set_lenc(s, id(cam_lenc_on));
          s->set_dcw(s, id(cam_dcw_on));
          s->set_bpc(s, id(cam_bpc_on));
          s->set_wpc(s, id(cam_wpc_on));
          s->set_raw_gma(s, id(cam_gma_on));
          s->set_colorbar(s, id(cam_colorbar_on));

# ─── CAMERA ─────────────────────────────────────────────────────────────────
# TEST ORDER: read the PID line first (see the CORRECTION block at the top of this file).
# Only if the log gives you no PID line do the tests below earn their build time.
#
# TEST 1 (settles the JPEG question only). Comment out the esp32_camera block below and
# the whole esp32_camera_web_server block, then flash this minimal version instead:
#
#   esp32_camera:
#     name: "AI Cam Outside"
#     id: outside_camera
#     external_clock:
#       pin: GPIO38
#       frequency: 10MHz
#     i2c_id: bus_a
#     data_pins: [GPIO45, GPIO47, GPIO48, GPIO46, GPIO42, GPIO40, GPIO39, GPIO21]
#     vsync_pin: GPIO17
#     href_pin: GPIO18
#     pixel_clock_pin: GPIO41
#     resolution: 640x480
#     pixel_format: RGB565
#     max_framerate: 5 fps
#     frame_buffer_count: 1
#
#   -> Initialises OK  = the sensor has no JPEG engine. It is a GC2145/GC0308 module,
#                        not the OV3660 this board was bought as. Order a replacement
#                        module; no config fixes this. (`pixel_format` is a 2026.x
#                        option — if it fails validation, note the exact message.)
#   -> Same error      = not the sensor. Go to TEST 2.
#
# TEST 2 (clock margin, cheap, unlikely). Set external_clock frequency: 20MHz and reflash
#   with the normal JPEG block. Waveshare's own examples for this board family use 20MHz;
#   the OV3660's PLL accepts 6-27MHz and esp32-camera does not range-check it. Held at
#   10MHz by default because that is what the KNOWN-GOOD ai_cam runs — changing it moves
#   away from the working reference, so only do it after the PID has been read.
#   -> Still failing = it is esphome/esphome#16926. Pin the framework in the esp32: block
#      above, or downgrade ESPHome (which is why min_version was removed).
#
# ══ NORMAL CONFIG (what should run once the camera works) ══
#
# OV3660: 1/5", 3 MP, 2048x1536 (QXGA) max, DVP, hardware JPEG compression,
# 3.2mm f/2.4, 68 deg diagonal FOV. XCLK spec range 6-27 MHz.
#
# Datasheet fps figures (15 @ QXGA, 20 @ 1080p, 60 @ VGA) are SENSOR maxima, not board
# throughput. The DVP + PSRAM path realistically gives ~25-30 fps below VGA, ~3-5 fps at
# 1600x1200, ~2-3 fps at QXGA (the driver gives QXGA its own 10 MHz PCLK branch).
#
# 800x600 @ 5 fps to match Frigate's detect: block. This board has no micro_wake_word, so
# unlike ai_cam it has RAM headroom for more — for 1600x1200 set frame_buffer_count: 1
# AND change Frigate's detect: width/height to match, or detection silently runs on a
# rescaled frame. Selecting 2560x1920/QSXGA validates but the driver clamps to QXGA with
# no error.
esp32_camera:
  name: "AI Cam Outside"
  id: outside_camera
  external_clock:
    pin: GPIO38
    frequency: 10MHz          # TEST 2: try 20MHz
  i2c_id: bus_a
  data_pins: [GPIO45, GPIO47, GPIO48, GPIO46, GPIO42, GPIO40, GPIO39, GPIO21]
  vsync_pin: GPIO17
  href_pin: GPIO18
  pixel_clock_pin: GPIO41
  resolution: 800x600
  jpeg_quality: 12
  max_framerate: 5 fps
  idle_framerate: 0.1 fps     # drops the sensor to a crawl when nothing is consuming
  frame_buffer_count: 2
  aec2: true                  # night-mode AEC — the single most useful outdoor knob
  agc_gain_ceiling: 8x        # outdoors at night; ai_cam runs 2x indoors

# These two fail as a CONSEQUENCE of the camera failing — they are not a separate fault.
# The board serves exactly ONE stream client at a time, so go2rtc must be the only thing
# pulling :8080. The WebRTC card is a consumer of go2rtc, not of this port.
esp32_camera_web_server:
  - port: 8080
    mode: stream
  - port: 8081
    mode: snapshot

# ─── INDICATOR ──────────────────────────────────────────────────────────────
output:
  - platform: gpio
    id: led_out
    pin:
      waveshare_io_ch32v003: io_expander
      number: 6                    # EXIO6 = PWR_LED (vendor driver, confirmed 2026-08-01)
      mode:
        output: true

light:
  - platform: binary
    name: "Status LED"
    id: status_led
    output: led_out
    restore_mode: ALWAYS_OFF     # outdoors — don't advertise the camera at night
    effects:
      - strobe:
      - strobe:
          name: "Fast Blink"
          colors:
            - state: true
              duration: 150ms
            - state: false
              duration: 150ms

# ─── SWITCHES ───────────────────────────────────────────────────────────────
switch:
  - platform: gpio
    name: "Camera Power Down"
    id: camera_pwdn
    restore_mode: ALWAYS_OFF      # EXIO3 LOW = camera powered. Never ALWAYS_ON.
    pin:
      waveshare_io_ch32v003: io_expander
      number: 3                   # EXIO3 = CAM_PWDN, active-high
      mode:
        output: true

  - platform: gpio
    name: "Amp Enable"
    id: amp_enable
    restore_mode: ALWAYS_OFF      # NS4150B class-D amp; no speaker use outside yet
    pin:
      waveshare_io_ch32v003: io_expander
      number: 4                   # EXIO4 = PA_CTRL, HIGH = amp on
      mode:
        output: true

  - platform: template
    name: "Camera Rotate 180"
    id: cam_rotate
    icon: "mdi:rotate-3d-variant"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_state:
      - lambda: |-
          id(outside_camera).set_horizontal_mirror(x);
          id(outside_camera).set_vertical_flip(x);
          if (esp_camera_sensor_get() != nullptr) id(outside_camera).update_camera_parameters();
      - script.execute: apply_camera_extras

  - platform: template
    name: "Camera Auto Exposure"
    id: cam_aec
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    disabled_by_default: true
    on_state:
      - lambda: |-
          id(outside_camera).set_aec_mode(x ? esp32_camera::ESP32_GC_MODE_AUTO : esp32_camera::ESP32_GC_MODE_MANU);
          if (esp_camera_sensor_get() != nullptr) id(outside_camera).update_camera_parameters();
      - script.execute: apply_camera_extras

  - platform: template
    name: "Camera Auto Gain"
    id: cam_agc
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    disabled_by_default: true
    on_state:
      - lambda: |-
          id(outside_camera).set_agc_mode(x ? esp32_camera::ESP32_GC_MODE_AUTO : esp32_camera::ESP32_GC_MODE_MANU);
          if (esp_camera_sensor_get() != nullptr) id(outside_camera).update_camera_parameters();
      - script.execute: apply_camera_extras

  # ── Driver-level toggles (no ESPHome knob exists for these).
  #    OV-family features — a GC2145/GC0308 driver silently no-ops most of them.
  - platform: template
    name: "Camera Auto White Balance"
    id: cam_awb
    icon: "mdi:white-balance-auto"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_state:
      - lambda: 'id(cam_awb_on) = x;'
      - script.execute: apply_camera_extras

  - platform: template
    name: "Camera AWB Gain"
    id: cam_awb_gain
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    disabled_by_default: true
    on_state:
      - lambda: 'id(cam_awb_gain_on) = x;'
      - script.execute: apply_camera_extras

  - platform: template
    name: "Camera Lens Correction"
    id: cam_lenc
    icon: "mdi:camera-metering-center"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    disabled_by_default: true
    on_state:
      - lambda: 'id(cam_lenc_on) = x;'
      - script.execute: apply_camera_extras

  - platform: template
    name: "Camera Downsize (DCW)"
    id: cam_dcw
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    disabled_by_default: true
    on_state:
      - lambda: 'id(cam_dcw_on) = x;'
      - script.execute: apply_camera_extras

  - platform: template
    name: "Camera Black Pixel Correction"
    id: cam_bpc
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    disabled_by_default: true
    on_state:
      - lambda: 'id(cam_bpc_on) = x;'
      - script.execute: apply_camera_extras

  - platform: template
    name: "Camera White Pixel Correction"
    id: cam_wpc
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    disabled_by_default: true
    on_state:
      - lambda: 'id(cam_wpc_on) = x;'
      - script.execute: apply_camera_extras

  - platform: template
    name: "Camera Raw Gamma"
    id: cam_gma
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    disabled_by_default: true
    on_state:
      - lambda: 'id(cam_gma_on) = x;'
      - script.execute: apply_camera_extras

  - platform: template
    name: "Camera Test Pattern"
    id: cam_colorbar
    icon: "mdi:test-tube"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    disabled_by_default: true
    on_state:
      - lambda: 'id(cam_colorbar_on) = x;'
      - script.execute: apply_camera_extras

# ─── SELECTS ────────────────────────────────────────────────────────────────
select:
  - platform: template
    name: "Camera Quality"
    id: cam_quality
    icon: "mdi:image-size-select-large"
    optimistic: true
    restore_value: true
    options: ["Best (10)", "Good (15)", "Medium (25)", "Low (40)", "Fastest (63)"]
    initial_option: "Good (15)"
    on_value:
      - lambda: |-
          int qa[] = { 10, 15, 25, 40, 63 };
