# =============================================================================
# Waveshare ESP32-S3-AUDIO-Board  ->  Home Assistant Assist voice satellite
# Far-field, echo-cancelled, on-device wake word "Hey Jarvis"
# -----------------------------------------------------------------------------
# Requires: Home Assistant >= 2026.6.0 (dual-channel mic) + a current ESPHome
#           (field-tested 2026.6.x). Board: ESP32-S3R8, 8MB PSRAM, 16MB flash,
#           ES8311 codec (out) + ES7210 4-ch ADC (in), dual MEMS mics, 7x RGB.
#
# READ FIRST: the AEC/AFE microphone-processor block (marked  <<VERIFY>> ) uses
# ESP-SR audio-front-end keys that Espressif/ESPHome have been actively
# renaming release to release. Flash the base config, then reconcile that ONE
# block against the ES7210 + microphone pages for YOUR installed ESPHome
# version (Devices > your node > shows the schema). Everything else is stable.
#
# PIN MAP NOTE: GPIOs below are the commonly-published Waveshare pinout. Confirm
# against the pins printed on the Waveshare wiki for your board revision before
# flashing; a wrong I2S/I2C pin is the #1 cause of "no audio".
# =============================================================================

substitutions:
  name: jarvis-lounge
  friendly_name: "JARVIS Lounge"
  wake_word: "hey_jarvis"        # community microWakeWord model

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.6.0
  # Board uses ESP32-S3 with 8MB Octal PSRAM
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf          # esp-idf required for ESP-SR audio front-end
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_SPIRAM_MODE_OCT: "y"          # 8MB Octal PSRAM
      CONFIG_SPIRAM_SPEED_80M: "y"

psram:
  mode: octal
  speed: 80MHz

logger:
api:
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {}                    # fallback hotspot for first-boot provisioning

# ---------------------------------------------------------------------------
# I2C  ->  configures the ES8311 (speaker codec) + ES7210 (mic ADC)
# ---------------------------------------------------------------------------
i2c:
  - id: i2c_bus
    sda: GPIO8
    scl: GPIO9
    frequency: 400kHz

# ---------------------------------------------------------------------------
# I2S buses.  ES7210 mic capture @16kHz, ES8311 speaker playback @48kHz.
# The ES7210's spare channels carry the AEC loopback REFERENCE of the speaker
# output -> this is what lets AEC cancel the board's OWN audio (barge-in).
# ---------------------------------------------------------------------------
i2s_audio:
  - id: i2s_in                 # microphones (ES7210)
    i2s_lrclk_pin: GPIO45
    i2s_bclk_pin: GPIO17
    i2s_mclk_pin: GPIO2
  - id: i2s_out                # speaker (ES8311)
    i2s_lrclk_pin: GPIO13
    i2s_bclk_pin: GPIO14
    i2s_mclk_pin: GPIO2

# ---- Speaker output codec (ES8311) ----------------------------------------
audio_dac:
  - platform: es8311
    id: es8311_dac
    address: 0x18
    i2c_id: i2c_bus

speaker:
  - platform: i2s_audio
    id: box_speaker
    i2s_audio_id: i2s_out
    dac_type: external
    i2s_dout_pin: GPIO15
    sample_rate: 48000
    bits_per_sample: 16bit
    channel: mono
    audio_dac: es8311_dac

# ---- Microphone input ADC (ES7210, 4-channel) -----------------------------
audio_adc:
  - platform: es7210
    id: es7210_adc
    address: 0x40
    i2c_id: i2c_bus
    bits_per_sample: 16bit
    sample_rate: 16000
    mic_gain: 30DB            # 0DB..37.5DB. 30DB is a good far-field start;
                             # drop to 24DB if you get clipping/false wakes.

# ===========================================================================
# <<VERIFY>>  MICROPHONE + ESP-SR AUDIO FRONT-END (AEC + BSS + NS + AGC)
# ---------------------------------------------------------------------------
# This is the heart of the far-field / anti-echo setup. The raw 2 mics + the
# speaker reference channel are fed through ESP-SR. input_format maps the
# ES7210 TDM channels:  M = mic, N = unused, R = playback reference.
#   "MMNR"  = mic0, mic1, (unused), reference   <- typical for this board
# Mode sr_low_cost = best balance for voice-assistant + wake word (~80KB RAM).
# Confirm the exact key names against your ESPHome version's ES7210/microphone
# docs; older builds expose this as a `noise_suppression:`/`aec:` sub-block,
# newer ones as an `audio_processor:` / `esp_afe:` processor.
# ===========================================================================
microphone:
  - platform: i2s_audio
    id: box_mic
    i2s_audio_id: i2s_in
    adc_type: external
    audio_adc: es7210_adc
    i2s_din_pin: GPIO16
    sample_rate: 16000
    bits_per_sample: 16bit
    channels: [0, 1]          # both mics -> enables BSS directional separation
    # --- ESP-SR audio front-end (verify keys per your ESPHome version) ---
    processor:
      platform: esp_afe        # full front end: AEC + BSS + NS + VAD + AGC
      mode: sr_low_cost        # recommended for VA + microWakeWord
      input_format: "MMNR"     # mic, mic, unused, reference(loopback)
      aec: true                # cancel the board's OWN playback (barge-in)
      separation: true         # BSS: pull your voice out by DIRECTION (vs TV)
      noise_suppression: true
      agc: true
      # reference speaker feeds the loopback channel used by AEC:
      reference_speaker: box_speaker

# ---------------------------------------------------------------------------
# On-device wake word — fires locally, before anything hits the network
# ---------------------------------------------------------------------------
micro_wake_word:
  id: mww
  models:
    - model: ${wake_word}      # "Hey Jarvis" (github: esphome/micro-wake-word-models)
  # If the TV causes FALSE wakes, raise this; if it MISSES you, lower slightly:
  # probability_cutoff: 0.97

# ---------------------------------------------------------------------------
# Voice assistant -> Home Assistant Assist pipeline
# ---------------------------------------------------------------------------
voice_assistant:
  id: va
  microphone:
    microphone: box_mic
    channels: 0               # post-AFE cleaned channel
    gain_factor: 4
  speaker: box_speaker
  micro_wake_word: mww
  noise_suppression_level: 3  # 0..4. 2-3 is the sweet spot; 4 hurts accuracy.
  auto_gain: 18dBFS           # 0..31. Lifts far voice; back off if clipping.
  volume_multiplier: 1.5      # raise only if still too quiet after auto_gain.
  on_wake_word_detected:
    - light.turn_on:          # RGB feedback: "I'm listening"
        id: rgb
        effect: "listening"
  on_stt_end:
    - light.turn_on: { id: rgb, effect: "thinking" }
  on_tts_start:
    - light.turn_on: { id: rgb, effect: "speaking" }
  on_end:
    - light.turn_off: rgb

# ---------------------------------------------------------------------------
# 7x addressable RGB LEDs — visual feedback (huge for far-field UX)
# ---------------------------------------------------------------------------
light:
  - platform: esp32_rmt_led_strip
    id: rgb
    name: "${friendly_name} Ring"
    pin: GPIO40               # verify against Waveshare pinout
    num_leds: 7
    chipset: WS2812
    rgb_order: GRB
    effects:
      - pulse: { name: "listening" }
      - pulse: { name: "thinking",  transition_length: 0.3s, update_interval: 0.3s }
      - pulse: { name: "speaking",  transition_length: 0.1s, update_interval: 0.1s }

# =============================================================================
# AFTER FLASHING — test protocol
# 1. Settings > Devices: node online, wake word entity present.
# 2. Say "Hey Jarvis" at 1m (TV off) -> ring pulses, command works.
# 3. Repeat at 3m, then across the room. Log pass/fail.
# 4. Turn TV on (moderate), repeat. Note the distance where it degrades.
# 5. Barge-in test: play music THROUGH this speaker, say "Hey Jarvis, stop"
#    at volume -> AEC should let it hear you (this is where AEC shines).
# 6. Tune in this order: placement (closer to you than TV, off-axis) ->
#    mic_gain / auto_gain -> noise_suppression_level -> wake probability_cutoff.
# 7. Still failing loud-TV-at-distance? Add a 2nd satellite before buying a
#    4-mic XMOS array. See the guide, section 5-6.
# =============================================================================
