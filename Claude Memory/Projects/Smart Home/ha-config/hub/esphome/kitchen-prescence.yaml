esphome:
  name: kitchen-presence
  friendly_name: Kitchen Presence

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:
  baud_rate: 0

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  output_power: "8.5dB"
  power_save_mode: none
  reboot_timeout: 0s
  ap:
    ssid: "Kitchen-Presence-Fallback"
    password: fallback123
  manual_ip:
    static_ip: 192.168.0.185
    gateway: 192.168.0.1
    subnet: 255.255.255.0
    dns1: 192.168.0.1
  use_address: 192.168.0.185

captive_portal:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

uart:
  id: ld2410_uart
  tx_pin: GPIO8
  rx_pin: GPIO7
  baud_rate: 256000
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 512

ld2410:
  id: presence_sensor
  uart_id: ld2410_uart

binary_sensor:
  - platform: ld2410
    ld2410_id: presence_sensor
    has_moving_target:
      name: "Kitchen Moving Target"
    has_still_target:
      name: "Kitchen Still Target"
    has_target:
      name: "Kitchen Presence"
      filters:
        - delayed_off: 30s

sensor:
  - platform: ld2410
    ld2410_id: presence_sensor
    moving_distance:
      name: "Kitchen Moving Distance"
      filters:
        - throttle: 1500ms
    still_distance:
      name: "Kitchen Still Distance"
      filters:
        - throttle: 1500ms
    detection_distance:
      name: "Kitchen Detection Distance"
      filters:
        - throttle: 1500ms

text_sensor:
  - platform: ld2410
    ld2410_id: presence_sensor
    version:
      name: "Kitchen LD2410 Firmware Version"
    mac_address:
      name: "Kitchen LD2410 MAC Address"

button:
  - platform: ld2410
    ld2410_id: presence_sensor
    factory_reset:
      name: "Kitchen LD2410 Factory Reset"
    restart:
      name: "Kitchen LD2410 Restart"
    query_params:
      name: "Kitchen LD2410 Query Params"

select:
  - platform: ld2410
    ld2410_id: presence_sensor
    distance_resolution:
      name: "Kitchen LD2410 Distance Resolution"
    baud_rate:
      name: "Kitchen LD2410 Baud Rate"

number:
  - platform: ld2410
    ld2410_id: presence_sensor
    timeout:
      name: "Kitchen LD2410 Timeout"
    max_move_distance_gate:
      name: "Kitchen Max Move Distance Gate"
    max_still_distance_gate:
      name: "Kitchen Max Still Distance Gate"
    g0:
      move_threshold:
        name: "Kitchen Gate 0 Move Threshold"
      still_threshold:
        name: "Kitchen Gate 0 Still Threshold"
    g1:
      move_threshold:
        name: "Kitchen Gate 1 Move Threshold"
      still_threshold:
        name: "Kitchen Gate 1 Still Threshold"
    g2:
      move_threshold:
        name: "Kitchen Gate 2 Move Threshold"
      still_threshold:
        name: "Kitchen Gate 2 Still Threshold"
    g3:
      move_threshold:
        name: "Kitchen Gate 3 Move Threshold"
      still_threshold:
        name: "Kitchen Gate 3 Still Threshold"
    g4:
      move_threshold:
        name: "Kitchen Gate 4 Move Threshold"
      still_threshold:
        name: "Kitchen Gate 4 Still Threshold"
    g5:
      move_threshold:
        name: "Kitchen Gate 5 Move Threshold"
      still_threshold:
        name: "Kitchen Gate 5 Still Threshold"
    g6:
      move_threshold:
        name: "Kitchen Gate 6 Move Threshold"
      still_threshold:
        name: "Kitchen Gate 6 Still Threshold"
    g7:
      move_threshold:
        name: "Kitchen Gate 7 Move Threshold"
      still_threshold:
        name: "Kitchen Gate 7 Still Threshold"
    g8:
      move_threshold:
        name: "Kitchen Gate 8 Move Threshold"
      still_threshold:
        name: "Kitchen Gate 8 Still Threshold"
