substitutions:
  wake_word_model: hey_jarvis   # okay_nabu | hey_jarvis | hey_mycroft | alexa

esphome:
  name: ai_cam
  friendly_name: AI Cam
  min_version: 2026.4.0
  name_add_mac_suffix: false
  compile_process_limit: 1
  on_boot:
    - priority: 700
      then:
        - lambda: 'delay(300);'   # EXIO3 power-gate race fix
    - priority: -100
      then:
        - script.execute: apply_camera_extras

external_components:
  - source:
      type: git
      url: https://github.com/sw3Dan/waveshare-s2-audio_esphome_voice
      ref: main
    components: [es8311]
  - source: github://mnark/esphome-components
    components: [sdmmc]

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

# baud_rate 0 is REQUIRED — GPIO43/44 are shared with SD_CMD / SD_D0.
# Logs still stream over the API to the ESPHome dashboard.
logger:
  level: DEBUG
  baud_rate: 0

api:
  encryption:
    key: !secret api_encryption_key
  on_client_connected:
    - if:
        condition:
          and:
            - switch.is_on: wake_word_enabled
            - not:
                voice_assistant.is_running:
        then:
          - micro_wake_word.start:
  on_client_disconnected:
    - voice_assistant.stop:
    - micro_wake_word.stop:

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # CHANGED 2026-08-06: was `true`.
  # fast_connect skips the AP scan and reconnects using the channel/BSSID
  # cached in NVS. The Virgin Media Hub 5 had "Channel Optimization" enabled,
  # which moves the 2.4 GHz channel on its own. A node cached on the old
  # channel then never finds the AP again — and because the cache survives
  # reboots, reboot_timeout below could not heal it either.
  # false costs ~1s of scan at boot and makes the node self-heal from any
  # future channel change. Only set this back to true for a hidden SSID.
  fast_connect: false
  power_save_mode: none
  reboot_timeout: 120s
  manual_ip:
    static_ip: 192.168.0.199
    gateway: 192.168.0.1
    subnet: 255.255.255.0
    dns1: 192.168.0.1
  use_address: 192.168.0.199
  ap:
    ssid: "AI-Cam-Fallback"
    password: "fallback123"

captive_portal:

web_server:
  port: 80

time:
  - platform: homeassistant
    id: ha_time

debug:
  update_interval: 60s

i2c:
  - id: bus_a
    sda: GPIO8
    scl: GPIO7
    scan: true

waveshare_io_ch32v003:
  - id: io_expander
    address: 0x24
    i2c_id: bus_a

# ─── SD CARD ────────────────────────────────────────────────────────────────
# TF-07F socket, 1-bit SDMMC mode.
# SD_CLK = GPIO16, SD_CMD = GPIO43 (U0TXD), SD_D0 = GPIO44 (U0RXD)
# SD_CS / D3 sits on expander EXIO2 and is held high by R32 — do not drive it.
sdmmc:
  id: sdcard
  name: "SD Card"
  clock_pin: GPIO16
  command_pin: GPIO43
  data_pin: GPIO44

globals:
  - id: save_to_disk
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: snapshot_name
    type: std::string
    restore_value: no
    initial_value: '"img.jpg"'
  - id: snapshot_count
    type: int
    restore_value: yes
    initial_value: '0'
  # ── OV3660 driver-level parameters not managed by ESPHome's esp32_camera ──
  # These are re-applied by the apply_camera_extras script so they survive
  # any call to update_camera_parameters() made by the ESPHome-managed entities.
  - id: cam_effect_idx
    type: int
    restore_value: yes
    initial_value: '0'
  - id: cam_wb_idx
    type: int
    restore_value: yes
    initial_value: '0'
  - id: cam_awb_on
    type: bool
    restore_value: yes
    initial_value: 'true'
  - id: cam_awb_gain_on
    type: bool
    restore_value: yes
    initial_value: 'true'
  - id: cam_sharpness_val
    type: int
    restore_value: yes
    initial_value: '0'
  - id: cam_denoise_val
    type: int
    restore_value: yes
    initial_value: '0'
  - id: cam_gain_val
    type: int
    restore_value: yes
    initial_value: '0'
  - id: cam_lenc_on
    type: bool
    restore_value: yes
    initial_value: 'true'
  - id: cam_dcw_on
    type: bool
    restore_value: yes
    initial_value: 'true'
  - id: cam_bpc_on
    type: bool
    restore_value: yes
    initial_value: 'true'
  - id: cam_wpc_on
    type: bool
    restore_value: yes
    initial_value: 'true'
  - id: cam_gma_on
    type: bool
    restore_value: yes
    initial_value: 'true'
  - id: cam_colorbar_on
    type: bool
    restore_value: yes
    initial_value: 'false'

script:
  # Re-applies every OV3660 register ESPHome does not own.
  # Called after any ESPHome-managed camera change so nothing gets clobbered.
  - id: apply_camera_extras
    mode: restart
    then:
      - delay: 150ms
      - lambda: |-
          sensor_t *s = esp_camera_sensor_get();
          if (s == nullptr) return;
          s->set_special_effect(s, id(cam_effect_idx));
          s->set_wb_mode(s, id(cam_wb_idx));
          s->set_whitebal(s, id(cam_awb_on));
          s->set_awb_gain(s, id(cam_awb_gain_on));
          s->set_sharpness(s, id(cam_sharpness_val));
          s->set_denoise(s, id(cam_denoise_val));
          s->set_agc_gain(s, id(cam_gain_val));
          s->set_lenc(s, id(cam_lenc_on));
          s->set_dcw(s, id(cam_dcw_on));
          s->set_bpc(s, id(cam_bpc_on));
          s->set_wpc(s, id(cam_wpc_on));
          s->set_raw_gma(s, id(cam_gma_on));
          s->set_colorbar(s, id(cam_colorbar_on));

# ─── CAMERA ─────────────────────────────────────────────────────────────────
# OV3660 native max = 2048x1536 (QXGA, 15 fps ceiling).
# 800x600 with 2 frame buffers is the safe budget alongside micro_wake_word.
# To go higher: set 1600x1200 AND frame_buffer_count: 1. 2048x1536 will only
# fit if you remove micro_wake_word entirely.
esp32_camera:
  name: "AI Cam"
  id: ai_camera
  external_clock:
    pin: GPIO38
    frequency: 10MHz
  i2c_id: bus_a
  data_pins: [GPIO45, GPIO47, GPIO48, GPIO46, GPIO42, GPIO40, GPIO39, GPIO21]
  vsync_pin: GPIO17
  href_pin: GPIO18
  pixel_clock_pin: GPIO41
  resolution: 800x600
  jpeg_quality: 12
  max_framerate: 5 fps
  idle_framerate: 0.1 fps
  frame_buffer_count: 2
  aec2: true
  agc_gain_ceiling: 2x
  on_image:
    then:
      - lambda: |-
          if (id(save_to_disk)) {
            id(sdcard).write_file(id(snapshot_name).c_str(), image.length, image.data);
            id(save_to_disk) = false;
            ESP_LOGI("sd", "Wrote %s (%d bytes)", id(snapshot_name).c_str(), image.length);
          }

esp32_camera_web_server:
  - port: 8080
    mode: stream
  - port: 8081
    mode: snapshot

# ─── AUDIO ──────────────────────────────────────────────────────────────────
i2s_audio:
  - id: i2s_bus
    i2s_mclk_pin: GPIO10
    i2s_bclk_pin: GPIO11
    i2s_lrclk_pin: GPIO12

audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: bus_a
    address: 0x18
    sample_rate: 16000
    bits_per_sample: 16bit
    use_mclk: true

# ES7210 is a 4-channel ADC; only MIC1/MIC2 are populated on this board.
audio_adc:
  - platform: es7210
    id: es7210_adc
    i2c_id: bus_a
    address: 0x40
    mic_gain: 30db      # compile-time only — audio_adc.set_gain is not a runtime action

speaker:
  - platform: i2s_audio
    id: spk
    dac_type: external
    audio_dac: es8311_dac
    i2s_audio_id: i2s_bus
    i2s_dout_pin: GPIO14
    sample_rate: 16000
    bits_per_sample: 16bit
    channel: mono
    timeout: 500ms      # NEVER use "never" — deadlocks the shared I2S bus
  - platform: mixer
    id: spk_mixer
    output_speaker: spk
    source_speakers:
      - id: mixer_announcement
      - id: mixer_media
  - platform: resampler
    id: resample_media
    output_speaker: mixer_media
  - platform: resampler
    id: resample_announcement
    output_speaker: mixer_announcement

microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: i2s_bus
    i2s_din_pin: GPIO13
    adc_type: external
    pdm: false
    channel: stereo
    sample_rate: 16000
    bits_per_sample: 16bit

# Ringtone / chime engine on the announcement path so it mixes with media.
rtttl:
  id: chimes
  speaker: resample_announcement

# ─── VOICE ──────────────────────────────────────────────────────────────────
# Two models compiled in; Home Assistant exposes a toggle per model.
# Adding a third is possible but pushes RAM hard alongside the camera.
micro_wake_word:
  id: mww
  microphone:
    microphone: mic
    channels: 0
    gain_factor: 4
  vad:
  models:
    - model: ${wake_word_model}
    - model: okay_nabu
    # - model: hey_mycroft
    # - model: alexa
  on_wake_word_detected:
    - light.turn_on: status_led
    - voice_assistant.start:
        wake_word: !lambda return wake_word;

voice_assistant:
  id: va
  microphone:
    microphone: mic
    channels: 0
    gain_factor: 4
  media_player: cam_media
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0
  on_listening:
    - light.turn_on: status_led
  on_tts_start:
    - light.turn_off: status_led
  on_end:
    - light.turn_off: status_led
    - wait_until:
        not:
          voice_assistant.is_running:
    - if:
        condition:
          switch.is_on: wake_word_enabled
        then:
          - micro_wake_word.start:
  on_error:
    - light.turn_off: status_led
    - if:
        condition:
          and:
            - lambda: return code != "duplicate_wake_up_detected";
            - lambda: return code != "stt-no-text-recognized";
        then:
          - logger.log:
              format: "Voice assistant error: %s"
              args: ['code.c_str()']
    - if:
        condition:
          switch.is_on: wake_word_enabled
        then:
          - micro_wake_word.start:
  # Assist timers ("set a timer for 10 minutes")
  on_timer_started:
    - logger.log: "Assist timer started"
  on_timer_cancelled:
    - logger.log: "Assist timer cancelled"
  on_timer_finished:
    - repeat:
        count: 5
        then:
          - light.turn_on: status_led
          - rtttl.play: "timer:d=8,o=6,b=180:c,c,c"
          - delay: 1200ms
          - light.turn_off: status_led
          - delay: 400ms

media_player:
  - platform: speaker
    name: "AI Cam Speaker"
    id: cam_media
    volume_increment: 0.05
    volume_min: 0.2
    volume_max: 1.0
    media_pipeline:
      speaker: resample_media
    announcement_pipeline:
      speaker: resample_announcement

# ─── INPUTS ─────────────────────────────────────────────────────────────────
binary_sensor:
  - platform: gpio
    name: "Boot Button"
    id: btn_boot
    pin:
      number: GPIO0
      mode:
        input: true
        pullup: true
      inverted: true
    on_press:
      - micro_wake_word.stop:
      - voice_assistant.start:

  - platform: gpio
    name: "User Button"
    id: btn_user
    pin:
      number: GPIO15
      mode:
        input: true
        pullup: true
      inverted: true

  # ETA6098 charge-status line on the CH32V003 (EXIO7 = CHG_DET).
  # If this reads inverted or stuck, flip `inverted` or comment it out.
  - platform: gpio
    name: "Charger Connected"
    id: charger_present
    device_class: plug
    entity_category: diagnostic
    pin:
      waveshare_io_ch32v003: io_expander
      number: 7
      mode:
        input: true
      inverted: true

# ─── OUTPUTS / LIGHT ────────────────────────────────────────────────────────
output:
  - platform: gpio
    id: led_out
    pin:
      waveshare_io_ch32v003: io_expander
      number: 6
      mode:
        output: true

light:
  - platform: binary
    name: "Status LED"
    id: status_led
    output: led_out
    effects:
      - strobe:
      - strobe:
          name: "Fast Blink"
          colors:
            - state: true
              duration: 150ms
            - state: false
              duration: 150ms

# ─── SWITCHES ───────────────────────────────────────────────────────────────
switch:
  - platform: template
    name: "Wake Word Enabled"
    id: wake_word_enabled
    icon: "mdi:microphone-message"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - if:
          condition:
            not:
              voice_assistant.is_running:
          then:
            - micro_wake_word.start:
    on_turn_off:
      - micro_wake_word.stop:

  - platform: gpio
    name: "Camera Power Down"
    id: camera_pwdn
    restore_mode: ALWAYS_OFF
    pin:
      waveshare_io_ch32v003: io_expander
      number: 3
      mode:
        output: true

  - platform: gpio
    name: "Amp Enable"
    id: amp_enable
    restore_mode: ALWAYS_ON
    pin:
      waveshare_io_ch32v003: io_expander
      number: 4
      mode:
        output: true

  - platform: template
    name: "Camera Horizontal Mirror"
    id: cam_mirror
    icon: "mdi:flip-horizontal"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_state:
      - lambda: |-
          id(ai_camera).set_horizontal_mirror(x);
          if (esp_camera_sensor_get() != nullptr) id(ai_camera).update_camera_parameters();
      - script.execute: apply_camera_extras

  - platform: template
    name: "Camera Vertical Flip"
    id: cam_flip
    icon: "mdi:flip-vertical"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_state:
      - lambda: |-
          id(ai_camera).set_vertical_flip(x);
          if (esp_camera_sensor_get() != nullptr) id(ai_camera).update_camera_parameters();
      - script.execute: apply_camera_extras

  - platform: template
    name: "Camera Auto Exposure"
    id: cam_aec
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    disabled_by_default: true
    on_state:
      - lambda: |-
          id(ai_camera).set_aec_mode(x ? esp32_camera::ESP32_GC_MODE_AUTO : esp32_camera::ESP32_GC_MODE_MANU);
          if (esp_camera_sensor_get() != nullptr) id(ai_camera).update_camera_parameters();
      - script.execute: apply_camera_extras

  - platform: template
    name: "Camera Auto Gain"
    id: cam_agc
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    disabled_by_default: true
    on_state:
      - lambda: |-
          id(ai_camera).set_agc_mode(x ? esp32_camera::ESP32_GC_MODE_AUTO : esp32_camera::ESP32_GC_MODE_MANU);
          if (esp_camera_sensor_get() != nullptr) id(ai_camera).update_camera_parameters();
      - script.execute: apply_camera_extras

  # ── OV3660 driver-level toggles (not exposed by ESPHome's esp32_camera) ──
  - platform: template
    name: "Camera Auto White Balance"
    id: cam_awb
    icon: "mdi:white-balance-auto"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_state:
      - lambda: 'id(cam_awb_on) = x;'
      - script.execute: apply_camera_extras

  - platform: template
    name: "Camera AWB Gain"
    id: cam_awb_gain
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    disabled_by_default: true
    on_state:
      - lambda: 'id(cam_awb_gain_on) = x;'
      - script.execute: apply_camera_extras

  - platform: template
    name: "Camera Lens Correction"
    id: cam_lenc
    icon: "mdi:camera-metering-center"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    disabled_by_default: true
    on_state:
      - lambda: 'id(cam_lenc_on) = x;'
      - script.execute: apply_camera_extras

  - platform: template
    name: "Camera Downsize (DCW)"
    id: cam_dcw
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    disabled_by_default: true
    on_state:
      - lambda: 'id(cam_dcw_on) = x;'
      - script.execute: apply_camera_extras

  - platform: template
    name: "Camera Black Pixel Correction"
    id: cam_bpc
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    disabled_by_default: true
    on_state:
      - lambda: 'id(cam_bpc_on) = x;'
      - script.execute: apply_camera_extras

  - platform: template
    name: "Camera White Pixel Correction"
    id: cam_wpc
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    disabled_by_default: true
    on_state:
      - lambda: 'id(cam_wpc_on) = x;'
      - script.execute: apply_camera_extras

  - platform: template
    name: "Camera Raw Gamma"
    id: cam_gma
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    disabled_by_default: true
    on_state:
      - lambda: 'id(cam_gma_on) = x;'
      - script.execute: apply_camera_extras

  - platform: template
    name: "Camera Test Pattern"
    id: cam_colorbar
    icon: "mdi:test-tube"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    disabled_by_default: true
    on_state:
      - lambda: 'id(cam_colorbar_on) = x;'
      - script.execute: apply_camera_extras

# ─── SELECTS ────────────────────────────────────────────────────────────────
select:
  - platform: template
    name: "Camera Quality"
    id: cam_quality
    icon: "mdi:image-size-select-large"
    optimistic: true
    restore_value: true
    options: ["Best (10)", "Good (15)", "Medium (25)", "Low (40)", "Fastest (63)"]
    initial_option: "Good (15)"
    on_value:
      - lambda: |-
          int qa[] = { 10, 15, 25, 40, 63 };
          id(ai_camera).set_jpeg_quality(qa[i]);
          sensor_t *s = esp_camera_sensor_get();
          if (s != nullptr) s->set_quality(s, qa[i]);

  - platform: template
    name: "Camera Special Effect"
    id: cam_effect
    icon: "mdi:image-filter-vintage"
    optimistic: true
    restore_value: true
    options: ["None", "Negative", "Grayscale", "Red Tint", "Green Tint", "Blue Tint", "Sepia"]
    initial_option: "None"
    on_value:
      - lambda: 'id(cam_effect_idx) = i;'
      - script.execute: apply_camera_extras

  - platform: template
    name: "Camera White Balance"
    id: cam_wb
    icon: "mdi:white-balance-sunny"
    optimistic: true
    restore_value: true
    options: ["Auto", "Sunny", "Cloudy", "Office", "Home"]
    initial_option: "Auto"
    on_value:
      - lambda: 'id(cam_wb_idx) = i;'
      - script.execute: apply_camera_extras

  - platform: template
    name: "Camera AGC Ceiling"
    id: cam_agc_ceiling
    icon: "mdi:image-filter-center-focus"
    optimistic: true
    restore_value: true
    disabled_by_default: true
    options: ["2x", "4x", "8x", "16x", "32x", "64x", "128x"]
    initial_option: "2x"
    on_value:
      - lambda: |-
          esp32_camera::ESP32AgcGainCeiling agc[] = {
            esp32_camera::ESP32_GAINCEILING_2X,
            esp32_camera::ESP32_GAINCEILING_4X,
            esp32_camera::ESP32_GAINCEILING_8X,
            esp32_camera::ESP32_GAINCEILING_16X,
            esp32_camera::ESP32_GAINCEILING_32X,
            esp32_camera::ESP32_GAINCEILING_64X,
            esp32_camera::ESP32_GAINCEILING_128X,
          };
          id(ai_camera).set_agc_gain_ceiling(agc[i]);
          if (esp_camera_sensor_get() != nullptr) id(ai_camera).update_camera_parameters();
      - script.execute: apply_camera_extras

# ─── NUMBERS ────────────────────────────────────────────────────────────────
number:
  - platform: template
    name: "Camera Brightness"
    id: cam_brightness
    icon: "mdi:brightness-6"
    optimistic: true
    restore_value: true
    initial_value: 0
    min_value: -2
    max_value: 2
    step: 1
    mode: slider
    set_action:
      - lambda: |-
          id(ai_camera).set_brightness((int)x);
          if (esp_camera_sensor_get() != nullptr) id(ai_camera).update_camera_parameters();
      - script.execute: apply_camera_extras

  - platform: template
    name: "Camera Contrast"
    id: cam_contrast
    icon: "mdi:contrast-box"
    optimistic: true
    restore_value: true
    initial_value: 0
    min_value: -2
    max_value: 2
    step: 1
    mode: slider
    set_action:
      - lambda: |-
          id(ai_camera).set_contrast((int)x);
          if (esp_camera_sensor_get() != nullptr) id(ai_camera).update_camera_parameters();
      - script.execute: apply_camera_extras

  - platform: template
    name: "Camera Saturation"
    id: cam_saturation
    icon: "mdi:palette"
    optimistic: true
    restore_value: true
    initial_value: 0
    min_value: -2
    max_value: 2
    step: 1
    mode: slider
    set_action:
      - lambda: |-
          id(ai_camera).set_saturation((int)x);
          if (esp_camera_sensor_get() != nullptr) id(ai_camera).update_camera_parameters();
      - script.execute: apply_camera_extras

  - platform: template
    name: "Camera Exposure Level"
    id: cam_ae_level
    icon: "mdi:brightness-7"
    optimistic: true
    restore_value: true
    initial_value: 0
    min_value: -2
    max_value: 2
    step: 1
    mode: slider
    set_action:
      - lambda: |-
          id(ai_camera).set_ae_level((int)x);
          if (esp_camera_sensor_get() != nullptr) id(ai_camera).update_camera_parameters();
      - script.execute: apply_camera_extras

  - platform: template
    name: "Camera ISO"
    id: cam_iso
    icon: "mdi:camera-iris"
    optimistic: true
    restore_value: true
    disabled_by_default: true
    initial_value: 300
    min_value: 0
    max_value: 1200
    step: 10
    mode: slider
    set_action:
      - lambda: |-
          id(ai_camera).set_aec_value((int)x);
          if (esp_camera_sensor_get() != nullptr) id(ai_camera).update_camera_parameters();
      - script.execute: apply_camera_extras

  # ── OV3660 driver-level numbers ──
  - platform: template
    name: "Camera Sharpness"
    id: cam_sharpness
    icon: "mdi:blur"
    optimistic: true
    restore_value: true
    initial_value: 0
    min_value: -3
    max_value: 3
    step: 1
    mode: slider
    set_action:
      - lambda: 'id(cam_sharpness_val) = (int)x;'
      - script.execute: apply_camera_extras

  - platform: template
    name: "Camera Denoise"
    id: cam_denoise
    icon: "mdi:grain"
    optimistic: true
    restore_value: true
    initial_value: 0
    min_value: 0
    max_value: 8
    step: 1
    mode: slider
    set_action:
      - lambda: 'id(cam_denoise_val) = (int)x;'
      - script.execute: apply_camera_extras

  - platform: template
    name: "Camera Manual Gain"
    id: cam_gain
    icon: "mdi:signal"
    optimistic: true
    restore_value: true
    disabled_by_default: true
    initial_value: 0
    min_value: 0
    max_value: 30
    step: 1
    mode: slider
    set_action:
      - lambda: 'id(cam_gain_val) = (int)x;'
      - script.execute: apply_camera_extras

# ─── BUTTONS ────────────────────────────────────────────────────────────────
button:
  - platform: template
    name: "Save Snapshot to SD"
    icon: "mdi:content-save"
    on_press:
      - lambda: |-
          id(snapshot_count)++;
          id(snapshot_name) = "snap" + std::to_string(id(snapshot_count)) + ".jpg";
          id(save_to_disk) = true;
      # CHANGED 2026-08-06: was `component.update: ai_camera` — COMPILE ERROR.
      # component.update only accepts a PollingComponent (one with update() and
      # an update_interval). ESP32Camera derives from camera::Camera and
      # overrides loop(), not update(), so the template cannot instantiate.
      # request_image() is the supported way to force a single frame, which
      # fires on_image and lets the lambda above write it to the SD card.
      - lambda: 'id(ai_camera).request_image(esphome::camera::API_REQUESTER);'

  - platform: template
    name: "Save Timestamped Snapshot"
    icon: "mdi:camera-timer"
    on_press:
      - lambda: |-
          char buf[32];
          auto t = id(ha_time).now();
          if (t.is_valid()) {
            t.strftime(buf, sizeof(buf), "%Y%m%d-%H%M%S.jpg");
            id(snapshot_name) = std::string(buf);
          } else {
            id(snapshot_count)++;
            id(snapshot_name) = "snap" + std::to_string(id(snapshot_count)) + ".jpg";
          }
          id(save_to_disk) = true;
      # CHANGED 2026-08-06: same fix as above.
      - lambda: 'id(ai_camera).request_image(esphome::camera::API_REQUESTER);'

  - platform: template
    name: "Start Voice Assistant"
    on_press:
      - micro_wake_word.stop:
      - voice_assistant.start:

  - platform: template
    name: "Play Chime"
    icon: "mdi:bell-ring"
    on_press:
      - rtttl.play: "chime:d=4,o=5,b=100:c,e,g"

  - platform: template
    name: "Stop Audio"
    icon: "mdi:stop"
    on_press:
      - rtttl.stop:
      - media_player.stop:

  - platform: template
    name: "Reapply Camera Settings"
    icon: "mdi:refresh"
    entity_category: config
    on_press:
      - script.execute: apply_camera_extras

  - platform: restart
    name: "Restart"

  - platform: safe_mode
    name: "Safe Mode Boot"
    entity_category: diagnostic

