# =============================================================================
# UNVERIFIED HARDWARE — DO NOT ENABLE UNTIL PINS ARE READ FROM THE VENDOR BSP
# github.com/waveshareteam/ESP32-S3-CAM-OVxxxx  (examples/ + bsp headers)
# =============================================================================
#
# ── BATTERY VOLTAGE ──
# GH1.25 2-pin single-cell Li-ion input, ETA6098 charger.
# Divider R39 200K (top) / R42 100K (bottom) => multiply measured ADC by 3.
# The BAT_ADC GPIO and whether BAT_EN is an ESP32 pin or an EXIO pin are
# NOT published. Confirm before enabling.
#
# sensor:
#   - platform: adc
#     pin: GPIOxx                # BAT_ADC — UNVERIFIED
#     name: "Battery Voltage"
#     attenuation: 12db
#     update_interval: 60s
#     accuracy_decimals: 2
#     device_class: voltage
#     unit_of_measurement: "V"
#     entity_category: diagnostic
#     filters:
#       - multiply: 3.0
#       - sliding_window_moving_average:
#           window_size: 5
#           send_every: 5
#
# ── DISPLAY BACKLIGHT (CH32V003 EXIO_PWM1) ──
# Only meaningful with a display module attached. The PWM output platform
# name for the expander is unconfirmed in the current component.
#
# output:
#   - platform: waveshare_io_ch32v003
#     id: lcd_bl_pwm
#     waveshare_io_ch32v003_id: io_expander
# light:
#   - platform: monochromatic
#     name: "Display Backlight"
#     output: lcd_bl_pwm
#
# ── SPARE EXPANDER PINS ──
# EXIO0 / EXIO1 / EXIO2 / EXIO5 are candidates for TP_RST / LCD_RST / SD_CS.
# EXIO2 in particular is tied to SD_CS/D3 and held high by R32 — driving it
# WILL break the SD card. Do not expose these as outputs without the BSP.
#
# ── EXTERNAL DISPLAY + TOUCH (18-pin FPC) ──
# The FPC carries BOTH a 4-wire SPI bus (LCD_SCK/MOSI/MISO/DC/CS) and a QSPI
# bus (QSPI_SCK/CS/D0-D3), plus I2C touch (TP_SCL/TP_SDA/TP_INT).
# LCD_RST and TP_RST are driven by the CH32V003; backlight is EXIO_PWM1.
# Supported modules: Waveshare 1.83" / 2" / 2.8" / 3.5" (sold separately),
# typically ST7789 (SPI) or ST7796/AXS15231B (QSPI) with CST816 or FT6336 touch.
#
# WARNING: this board is GPIO-starved. The DVP camera consumes 11 pins, SD
# consumes 3, audio consumes 5, I2C 2. A display almost certainly CANNOT
# coexist with the full camera + SD + audio stack. Treat display and camera
# as MUTUALLY EXCLUSIVE builds.
#
# spi:
#   - id: lcd_spi
#     clk_pin: GPIOxx            # UNVERIFIED
#     mosi_pin: GPIOxx           # UNVERIFIED
# display:
#   - platform: ili9xxx          # or st7789v / mipi_spi / qspi_dbi per module
#     model: ...
#     spi_id: lcd_spi
#     cs_pin: GPIOxx             # UNVERIFIED
#     dc_pin: GPIOxx             # UNVERIFIED
#     reset_pin:
#       waveshare_io_ch32v003: io_expander
#       number: 1                # LCD_RST candidate — UNVERIFIED
# touchscreen:
#   - platform: cst816           # or ft5x06 per module
#     i2c_id: bus_a
#     interrupt_pin: GPIOxx      # UNVERIFIED
#     reset_pin:
#       waveshare_io_ch32v003: io_expander
#       number: 0                # TP_RST candidate — UNVERIFIED
#
# ── SD FREE/USED SPACE SENSORS ──
# Would require swapping the mnark `sdmmc` component for
# github://n-serrette/esphome_sd_card (sd_mmc_card). The two CANNOT coexist
# on the same pins, and swapping loses your working write_file snapshot action.
# Not recommended unless you specifically need space reporting.
# =============================================================================