substitutions:
  dev_name: "switch-node"
  friendly_name: "Switch Node"
  ip_static: 192.168.0.206

esphome:
  name: ${dev_name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:
  baud_rate: 0

api:
  encryption:
    key: "sVNCit4PxBTqQTDbkJgUHy37OYz+cIhnumo91DJmz6g="

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  output_power: "8.5dB"
  power_save_mode: none
  reboot_timeout: 120s
  ap:
    ssid: "Switch Node Fallback"
    password: "fallback123"
  manual_ip:
    static_ip: ${ip_static}
    gateway: 192.168.0.1
    subnet: 255.255.255.0
    dns1: 192.168.0.1
  use_address: ${ip_static}

captive_portal:

web_server:
  port: 80

# ─── SERVO OUTPUT ────────────────────────────────────────────────────────────
# SG90 signal wire → GPIO4
# SG90 VCC (red)   → 5V pin (or VBUS on ESP32-S3-Zero)
# SG90 GND (brown) → GND
# Servo is centred at 90°, pushes ON at 160°, pushes OFF at 20°
# After each press it returns to 90° (neutral) so it's ready for next command

output:
  - platform: ledc
    id: servo_pwm
    pin: GPIO4
    frequency: 50Hz

servo:
  - id: light_switch_servo
    output: servo_pwm
    # ESPHome servo level: -1.0 = ~0°, 0.0 = ~90°, 1.0 = ~180°
    # Calibrate min/max pulse widths to your specific SG90 if needed
    min_level: 3.0%   # ~500µs → 0°
    max_level: 12.0%  # ~2400µs → 180°
    idle_level: 7.5%  # ~1500µs → 90° (neutral, centre)
    auto_detach_time: 1500ms  # Cuts PWM after 1.5s to stop servo buzzing/jitter

# ─── SWITCH ENTITY (exposed to HA) ───────────────────────────────────────────
# This is what Home Assistant sees and controls.
# Tracks its own on/off state in ESPHome.

switch:
  - platform: template
    name: "Gang Light Switch"
    id: gang_switch
    optimistic: true   # HA reflects the command immediately — no feedback sensor
    turn_on_action:
      - logger.log: "Switch ON — servo pressing ON side"
      - servo.write:
          id: light_switch_servo
          level: 77.8%   # 160° — adjust this angle to match your physical button position
      - delay: 400ms     # Hold the press long enough to register
      - servo.write:
          id: light_switch_servo
          level: 50.0%   # Back to 90° neutral
    turn_off_action:
      - logger.log: "Switch OFF — servo pressing OFF side"
      - servo.write:
          id: light_switch_servo
          level: 22.2%   # 20° — adjust to match the OFF button position
      - delay: 400ms
      - servo.write:
          id: light_switch_servo
          level: 50.0%   # Back to 90° neutral

# ─── DIAGNOSTICS ─────────────────────────────────────────────────────────────
sensor:
  - platform: wifi_signal
    name: "Switch Node WiFi Signal"
    update_interval: 60s
  - platform: uptime
    name: "Switch Node Uptime"
    update_interval: 60s

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "Switch Node IP Address"
    ssid:
      name: "Switch Node WiFi SSID"
  - platform: version
    name: "Switch Node ESPHome Version"