# ─── BUTTONS ────────────────────────────────────────────────────────────────
button:
  - platform: template
    name: "Save Snapshot to SD"
    icon: "mdi:content-save"
    on_press:
      - lambda: |-
          id(snapshot_count)++;
          id(snapshot_name) = "snap" + std::to_string(id(snapshot_count)) + ".jpg";
          id(save_to_disk) = true;
      # CHANGED 2026-08-06: was `component.update: ai_camera` — COMPILE ERROR.
      # component.update only accepts a PollingComponent (one with update() and
      # an update_interval). ESP32Camera derives from camera::Camera and
      # overrides loop(), not update(), so the template cannot instantiate.
      # request_image() is the supported way to force a single frame, which
      # fires on_image and lets the lambda above write it to the SD card.
      - lambda: 'id(ai_camera).request_image(esphome::camera::API_REQUESTER);'

  - platform: template
    name: "Save Timestamped Snapshot"
    icon: "mdi:camera-timer"
    on_press:
      - lambda: |-
          char buf[32];
          auto t = id(ha_time).now();
          if (t.is_valid()) {
            t.strftime(buf, sizeof(buf), "%Y%m%d-%H%M%S.jpg");
            id(snapshot_name) = std::string(buf);
          } else {
            id(snapshot_count)++;
            id(snapshot_name) = "snap" + std::to_string(id(snapshot_count)) + ".jpg";
          }
          id(save_to_disk) = true;
      # CHANGED 2026-08-06: same fix as above.
      - lambda: 'id(ai_camera).request_image(esphome::camera::API_REQUESTER);'

  - platform: template
    name: "Start Voice Assistant"
    on_press:
      - micro_wake_word.stop:
      - voice_assistant.start:

  - platform: template
    name: "Play Chime"
    icon: "mdi:bell-ring"
    on_press:
