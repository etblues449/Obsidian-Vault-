# §3 — APPLYABLE once BEDROOM_LIGHT_ENTITY is substituted.
# Both AI CAM 2 entities below are verified live and responsive, so this one needs no
# hardware work — only a light to point at. It also gives the bedroom a working manual
# control while the presence radar is down, which is worth having on its own.
- id: bedroom_ai_cam_2_button
  alias: Bedroom - AI Cam 2 button toggles light
  triggers:
  - trigger: state
    entity_id: binary_sensor.ai_cam_2_user_button      # VERIFIED live, currently 'off'
    to: 'on'
  actions:
  - action: light.toggle
    target:
      entity_id: BEDROOM_LIGHT_ENTITY                  # <-- SUBSTITUTE BEFORE PASTING
  # Audible confirmation: the button gives no tactile feedback in the dark.
  - action: button.press
    target:
      entity_id: button.ai_cam_2_play_chime            # VERIFIED live
  mode: single
