# Bedroom lights + AI CAM 2 — PROPOSED, NOT APPLIED
#
# Revised 2026-08-31 against LIVE REGISTRY data (see
# diagnostics/2026-08-31-bedroom-entity-audit.md). Every AI CAM 2 entity below was read
# off `curl /api/states`, not inferred from a config file. The first draft of this file
# guessed the `ai_cam_outside_` prefix from ai-cam-outside.yaml — that guess was WRONG,
# which is why it was never pasted.
#
# ── THE BLOCKER ───────────────────────────────────────────────────────────────
#
# `light.bedroom_light` DOES NOT EXIST, and neither does any other bedroom light.
# `binary_sensor.bedroom_bedroom_presence` DOES NOT EXIST either.
#
# The two automations currently live on the hub (`bedroom_enter`, `bedroom_empty`) are
# both enabled and both point at those two absent entities. They have never been able to
# fire. This file does not "update" them — there is nothing working to update. It
# rebuilds them, and one input is still missing.
#
# Fill in BEDROOM_LIGHT_ENTITY below once the bedroom light exists in HA. Until then
# only §3 is applyable, and only after substituting that entity.
#
# ── VERIFIED ENTITY IDs (live, 2026-08-31) ────────────────────────────────────
#
#   binary_sensor.ai_cam_2_user_button ................. off      (responsive)
#   button.ai_cam_2_play_chime ......................... unknown  (normal for a button)
#   assist_satellite.landing_ai_cam_2_assist_satellite . idle
#   switch.ai_cam_2_wake_word_enabled .................. on
#
# Note the split prefix — it is not a typo. The board was provisioned on the Landing and
# renamed to AI CAM 2; only some entities re-slugged, so `ai_cam_2_*` and
# `landing_ai_cam_2_*` are both live on the same device. Copy them exactly.
#
# ── HOW TO APPLY ──────────────────────────────────────────────────────────────
#
# `ha-config/automations.yaml` in this vault is an EXPORT, not a source. Editing it
# changes nothing. These are UI-managed: Settings -> Automations -> (⋮) -> Edit in YAML.
#
# ──────────────────────────────────────────────────────────────────────────────

