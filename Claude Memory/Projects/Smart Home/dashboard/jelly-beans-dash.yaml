          - type: heading
            heading: Landing
            icon: mdi:stairs
          - type: custom:decluttering-card
            template: jb_presence
            variables:
              - name: Presence
              - presence: binary_sensor.landing_presence
          - type: custom:decluttering-card
            template: jb_light
            variables:
              - entity: light.stairs_smart_bulb
              - name: Stairs
              - icon: mdi:stairs-box
          - type: custom:decluttering-card
            template: jb_light
            variables:
