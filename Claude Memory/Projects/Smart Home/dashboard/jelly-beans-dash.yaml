# Jelly Bean's Dash — CANONICAL SOURCE (redesigned 2026-08-02, deployed live)
# Deployed to the hub's "Jelly Bean's Dash" (url_path: jelly-bean-s-dash) via
# lovelace/config/save. Edit here -> redeploy; backups in live-backups/.
#
# Design notes (2026-08-02):
# - Scenes scene.evening/night/movie/all_off CREATED on the hub this session (editable in UI)
# - Frigate-dependent cards carry visibility conditions -> hidden until the integration
#   connects, then self-reveal (no dead cards meanwhile)
# - "LOUNGE TV" card bug fixed (was pointing at the soundbar entity)
# - Phone battery chip added (replaces dead climate.ember)
# - Outside cam (camera.ai_cam_2_ai_cam_outside) added: Home cameras grid + Outside section
# - System: real node WiFi sensors + Voice satellites + Batteries sections
# - bedroom/landing presence entities are currently offline nodes; mushroom templates
#   degrade to "Offline" gracefully and recover when the nodes are reflashed
# HACS deps: mushroom, bubble-card, decluttering-card, auto-entities (all already installed)

decluttering_templates:
  jb_light:
    default:
      - icon: mdi:lightbulb
    card:
      type: custom:mushroom-light-card
      entity: '[[entity]]'
      name: '[[name]]'
      icon: '[[icon]]'
      layout: horizontal
      use_light_color: true
      show_brightness_control: true
      show_color_control: true
      show_color_temp_control: false
      collapsible_controls: true
      tap_action:
        action: toggle
      hold_action:
        action: more-info
  jb_presence:
    card:
      type: custom:mushroom-template-card
      entity: '[[presence]]'
      primary: '[[name]]'
      secondary: >-
        {% if is_state('[[presence]]','on') %}Occupied{% elif
        is_state('[[presence]]','off') %}Clear{% else %}Offline{% endif %}
      icon: >-
        {{ 'mdi:motion-sensor' if is_state('[[presence]]','on') else
        'mdi:motion-sensor-off' }}
      icon_color: >-
        {% if is_state('[[presence]]','on') %}green{% elif
        is_state('[[presence]]','off') %}grey{% else %}red{% endif %}
      layout: horizontal
      tap_action:
        action: more-info
  jb_node:
    card:
      type: custom:mushroom-template-card
      entity: '[[wifi]]'
      primary: '[[name]]'
      secondary: >-
        {% set r = states('[[wifi]]') %}{% if r in
        ['unknown','unavailable','none',''] %}Offline{% else %}{{ r | int(0) }}
        dBm{% endif %}
      icon: >-
        {% set r = states('[[wifi]]') %}{% if r in
        ['unknown','unavailable','none',''] %}mdi:wifi-off{% elif r | int(0) >
        -60 %}mdi:wifi-strength-4{% elif r | int(0) > -70
        %}mdi:wifi-strength-3{% elif r | int(0) > -80 %}mdi:wifi-strength-2{%
        else %}mdi:wifi-strength-1{% endif %}
      icon_color: >-
        {% set r = states('[[wifi]]') %}{% if r in
        ['unknown','unavailable','none',''] %}red{% elif r | int(0) > -70
        %}green{% elif r | int(0) > -80 %}amber{% else %}orange{% endif %}
      layout: horizontal
      tap_action:
        action: more-info
  jb_scene:
    card:
      type: custom:mushroom-template-card
      primary: '[[name]]'
      icon: '[[icon]]'
      icon_color: '[[color]]'
      layout: vertical
      fill_container: true
      tap_action:
        action: perform-action
        perform_action: scene.turn_on
        target:
          entity_id: '[[scene]]'
  jb_satellite:
    card:
      type: custom:mushroom-template-card
      entity: '[[sat]]'
      primary: '[[name]]'
      secondary: >-
        {% set s = states('[[sat]]') %}{% if s in
        ['unknown','unavailable','none',''] %}Offline{% else %}{{ s | title
        }}{% endif %}
      icon: mdi:account-voice
      icon_color: >-
        {% set s = states('[[sat]]') %}{% if s in
        ['unknown','unavailable','none',''] %}red{% elif s == 'idle' %}green{%
        else %}blue{% endif %}
      layout: horizontal
      tap_action:
        action: more-info

title: Jelly Bean's House
views:
  # ───────────────────────────── HOME ─────────────────────────────
  - title: Home
    path: home
    icon: mdi:home-variant
    type: sections
    max_columns: 3
    dense_section_placement: true
    theme: Jelly Bean
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: custom:mushroom-template-card
            primary: >-
              {% set h = now().hour %}{% if h < 5 %}Good night{% elif h < 12
              %}Good morning{% elif h < 18 %}Good afternoon{% else %}Good
              evening{% endif %}, Elliot
            secondary: >-
              {% set n = states.light | selectattr('state','eq','on') | list |
              count %}{% set occ =
              ['binary_sensor.living_room_kitchen_presence_kitchen_presence','binary_sensor.bedroom_presence','binary_sensor.landing_presence']
              | map('states') | select('eq','on') | list | count %}{{ n }}
              light{{ 's' if n != 1 }} on · {{ occ }} room{{ 's' if occ != 1 }}
              occupied
            icon: mdi:home-heart
            icon_color: >-
              {{ 'blue' if states.light | selectattr('state','eq','on') | list |
              count > 0 else 'grey' }}
            layout: horizontal
            multiline_secondary: true
            tap_action:
              action: none
          - type: custom:mushroom-chips-card
            alignment: start
            chips:
              - type: template
                entity: binary_sensor.living_room_kitchen_presence_kitchen_presence
                icon: mdi:sofa
                content: Lounge
                icon_color: >-
                  {{ 'green' if
                  is_state('binary_sensor.living_room_kitchen_presence_kitchen_presence','on')
                  else 'grey' }}
                tap_action:
                  action: navigate
                  navigation_path: rooms
              - type: template
                entity: binary_sensor.bedroom_presence
                icon: mdi:bed
                content: Bedroom
                icon_color: >-
                  {{ 'green' if is_state('binary_sensor.bedroom_presence','on')
                  else 'grey' }}
                tap_action:
                  action: navigate
                  navigation_path: rooms
              - type: template
                entity: binary_sensor.landing_presence
                icon: mdi:stairs
                content: Landing
                icon_color: >-
                  {{ 'green' if is_state('binary_sensor.landing_presence','on')
                  else 'grey' }}
                tap_action:
                  action: navigate
                  navigation_path: rooms
              - type: template
                entity: sensor.jelly_bean_s_phone_battery_level
                icon: >-
                  {% set b = states('sensor.jelly_bean_s_phone_battery_level') |
                  int(0) %}{% if b > 80 %}mdi:battery{% elif b > 50
                  %}mdi:battery-60{% elif b > 20 %}mdi:battery-30{% else
                  %}mdi:battery-alert{% endif %}
                content: >-
                  {{ states('sensor.jelly_bean_s_phone_battery_level') }}%
                icon_color: >-
                  {% set b = states('sensor.jelly_bean_s_phone_battery_level') |
                  int(0) %}{{ 'red' if b <= 20 else 'amber' if b <= 50 else
                  'green' }}
                tap_action:
                  action: more-info
              - type: template
                entity: input_boolean.away_mode
                icon: >-
                  {{ 'mdi:shield-home' if
                  is_state('input_boolean.away_mode','on') else
                  'mdi:shield-home-outline' }}
                content: Away
                icon_color: >-
                  {{ 'red' if is_state('input_boolean.away_mode','on') else
                  'grey' }}
                tap_action:
                  action: toggle
              - type: template
                entity: input_boolean.guest_mode
                icon: mdi:account-group
                content: Guest
                icon_color: >-
                  {{ 'purple' if is_state('input_boolean.guest_mode','on') else
                  'grey' }}
                tap_action:
                  action: toggle
      - type: grid
        column_span: 3
        cards:
          - type: grid
            columns: 4
            square: false
            cards:
              - type: custom:decluttering-card
                template: jb_scene
                variables:
                  - name: Evening
                  - icon: mdi:weather-sunset
                  - color: amber
                  - scene: scene.evening
              - type: custom:decluttering-card
                template: jb_scene
                variables:
                  - name: Night
                  - icon: mdi:weather-night
                  - color: indigo
                  - scene: scene.night
              - type: custom:decluttering-card
                template: jb_scene
                variables:
                  - name: Movie
                  - icon: mdi:movie-open-outline
                  - color: deep-purple
                  - scene: scene.movie
              - type: custom:decluttering-card
                template: jb_scene
                variables:
                  - name: All Off
                  - icon: mdi:power
                  - color: red
                  - scene: scene.all_off
      - type: grid
        cards:
          - type: custom:auto-entities
            show_empty: false
            card:
              type: grid
              columns: 1
              square: false
            card_param: cards
            filter:
              include:
                - domain: light
                  state: 'on'
                  options:
                    type: custom:mushroom-light-card
                    entity: this.entity_id
                    layout: horizontal
                    use_light_color: true
                    show_brightness_control: true
                    show_color_control: true
                    show_color_temp_control: false
                    collapsible_controls: true
              exclude:
                - entity_id: light.living_room_ai_cam_status_led
                - entity_id: light.home_assistant_voice_09eabd_led_ring
                - entity_id: light.living_room_esp_speaker_status_ring
                - entity_id: light.living_room_rgbic_tv_backlight_segments
            sort:
              method: name
              ignore_case: true
      - type: grid
        cards:
          - type: custom:bubble-card
            card_type: button
            button_type: name
            name: Lounge
            icon: mdi:sofa
            entity: light.living_room_light
            show_state: true
            sub_button:
              - entity: binary_sensor.living_room_kitchen_presence_kitchen_presence
                icon: mdi:motion-sensor
                show_name: false
                show_background: false
            button_action:
              tap_action:
                action: navigate
                navigation_path: rooms
          - type: custom:bubble-card
            card_type: button
            button_type: name
            name: Bedroom
            icon: mdi:bed
            entity: light.bedroom
            show_state: true
            sub_button:
              - entity: binary_sensor.bedroom_presence
                icon: mdi:motion-sensor
                show_name: false
                show_background: false
            button_action:
              tap_action:
                action: navigate
                navigation_path: rooms
          - type: custom:bubble-card
            card_type: button
            button_type: name
            name: Landing
            icon: mdi:stairs
            entity: light.stairs_smart_bulb
            show_state: true
            sub_button:
              - entity: binary_sensor.landing_presence
                icon: mdi:motion-sensor
                show_name: false
                show_background: false
            button_action:
              tap_action:
                action: navigate
                navigation_path: rooms
          - type: custom:bubble-card
            card_type: button
            button_type: name
            name: Kids Room
            icon: mdi:teddy-bear
            entity: light.kids_bedroom
            show_state: true
            button_action:
              tap_action:
                action: navigate
                navigation_path: rooms
      - type: grid
        cards:
          - type: custom:mushroom-template-card
            entity: media_player.spotify_elliot_horton
            primary: Spotify
            secondary: >-
              {% set p = 'media_player.spotify_elliot_horton' %}{% if
              is_state(p,'playing') %}{{ state_attr(p,'media_title') }} — {{
              state_attr(p,'media_artist') }}{% elif is_state(p,'paused')
              %}Paused{% else %}Open player{% endif %}
            icon: mdi:spotify
            icon_color: >-
              {{ 'green' if
              is_state('media_player.spotify_elliot_horton','playing') else
              'grey' }}
            layout: horizontal
            multiline_secondary: true
            tap_action:
              action: more-info
          - type: custom:mushroom-media-player-card
            entity: media_player.jelly_beans_tv_3
            name: Lounge TV
            use_media_info: true
            show_volume_level: true
            volume_controls:
              - volume_mute
              - volume_set
            media_controls:
              - play_pause_stop
              - previous
              - next
            visibility:
              - condition: state
                entity: media_player.jelly_beans_tv_3
                state_not: 'off'
              - condition: state
                entity: media_player.jelly_beans_tv_3
                state_not: unavailable
          - type: custom:mushroom-media-player-card
            entity: media_player.jelly_bean_s_soundbar_media_player
            name: Soundbar
            use_media_info: true
            show_volume_level: true
            volume_controls:
              - volume_mute
              - volume_set
            visibility:
              - condition: state
                entity: media_player.jelly_bean_s_soundbar_media_player
                state_not: 'off'
              - condition: state
                entity: media_player.jelly_bean_s_soundbar_media_player
                state_not: unavailable
          - type: custom:mushroom-media-player-card
            entity: media_player.bedroom_sambed
            name: Bedroom TV
            use_media_info: true
            show_volume_level: true
            visibility:
              - condition: state
                entity: media_player.bedroom_sambed
                state_not: 'off'
              - condition: state
                entity: media_player.bedroom_sambed
                state_not: unavailable
      - type: grid
        cards:
          - type: heading
            heading: Cameras
            icon: mdi:cctv
          - show_state: false
            show_name: true
            camera_view: auto
            fit_mode: cover
            type: picture-entity
            entity: camera.living_room_ai_cam_ai_cam
            name: AI Cam — Living Room
          - show_state: false
            show_name: true
            camera_view: auto
            fit_mode: cover
            type: picture-entity
            entity: camera.ai_cam_2_ai_cam_outside
            name: AI Cam — Outside

