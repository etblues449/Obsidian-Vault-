# ─────────────────────────────────────────────────────────────────────────────
  # ───────────────────────────── ROOMS ─────────────────────────────
  - title: Rooms
    path: rooms
    icon: mdi:floor-plan
    type: sections
    max_columns: 3
    dense_section_placement: true
    theme: Jelly Bean
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Lounge
            icon: mdi:sofa
          - type: custom:decluttering-card
            template: jb_presence
            variables:
              - name: Presence
              - presence: binary_sensor.living_room_kitchen_presence_kitchen_presence
          - type: custom:decluttering-card
            template: jb_light
            variables:
              - entity: light.left_smart_bulb
              - name: Left
          - type: custom:decluttering-card
            template: jb_light
            variables:
              - entity: light.right_smart_bulb
              - name: Right
          - type: custom:decluttering-card
            template: jb_light
            variables:
              - entity: light.rgbic_tv_backlight
              - name: TV Backlight
              - icon: mdi:television-ambient-light
          - type: tile
            entity: switch.rgbic_tv_backlight_dreamview
            name: DreamView Sync
            icon: mdi:television-play
          - type: custom:mushroom-media-player-card
            entity: media_player.jelly_beans_tv_3
            name: Lounge TV
            use_media_info: true
            show_volume_level: true
            media_controls:
              - on_off
              - previous
              - play_pause_stop
              - next
            volume_controls:
              - volume_buttons
              - volume_set
              - volume_mute
          - type: custom:mushroom-media-player-card
            entity: media_player.jelly_bean_s_soundbar_media_player
            name: Soundbar
            use_media_info: true
            show_volume_level: true
            volume_controls:
              - volume_buttons
              - volume_set
              - volume_mute
          - type: custom:decluttering-card
            template: jb_satellite
            variables:
              - name: Voice PE
              - sat: assist_satellite.home_assistant_voice
          - type: custom:decluttering-card
            template: jb_satellite
            variables:
              - name: AI Cam Voice
              - sat: assist_satellite.living_room_ai_cam_assist_satellite
      - type: grid
        cards:
          - type: heading
            heading: Bedroom
            icon: mdi:bed
          - type: custom:decluttering-card
            template: jb_presence
            variables:
              - name: Presence
              - presence: binary_sensor.bedroom_presence
          - type: custom:decluttering-card
            template: jb_light
            variables:
              - entity: light.bedroom
              - name: Bedroom Light
              - icon: mdi:ceiling-light
          - type: custom:mushroom-media-player-card
            entity: media_player.bedroom_sambed
            name: Bedroom TV
            use_media_info: true
            show_volume_level: true
          - type: custom:decluttering-card
            template: jb_satellite
            variables:
              - name: Bedside Voice
              - sat: assist_satellite.esp_speaker
      - type: grid
