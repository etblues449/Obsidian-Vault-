            icon: mdi:account-voice
          - type: custom:decluttering-card
            template: jb_satellite
            variables:
              - name: Voice PE (Lounge)
              - sat: assist_satellite.home_assistant_voice
          - type: custom:decluttering-card
            template: jb_satellite
            variables:
              - name: AI Cam (Lounge)
              - sat: assist_satellite.living_room_ai_cam_assist_satellite
          - type: custom:decluttering-card
            template: jb_satellite
            variables:
              - name: ESP Speaker
              - sat: assist_satellite.esp_speaker
      - type: grid
        cards:
          - type: heading
            heading: Batteries
            icon: mdi:battery-heart-variant
          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.jelly_bean_s_phone_battery_level
                name: Jelly Bean's Phone
              - entity: sensor.jb_s_phone_battery_level
                name: JB's Phone
