# JARVIS Skill 3 — Connection Finder · Sunday 14:00 Europe/London
# Fires at 13:00 and 14:00 UTC on Sundays; the runner's guard (Sun, 14:00
# London) admits exactly one, DST-correct year round.
name: JARVIS 3 · Connection Finder

on:
  schedule:
    - cron: '0 13,14 * * 0'
  workflow_dispatch:
    inputs:
      force:
        description: 'Run now, ignoring the Sunday 14:00 London time guard'
        type: boolean
        default: true

jobs:
  connection-finder:
    uses: ./.github/workflows/_jarvis-run-skill.yml
    secrets: inherit
    with:
      skill: connection-finder
      force: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
