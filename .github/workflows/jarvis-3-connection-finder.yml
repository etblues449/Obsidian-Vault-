# JARVIS Skill — Connection Finder
# Scheduled: Sunday 14:00  (Europe/London)
#
# GitHub cron is UTC and has no timezone. Two crons fire year-round:
#   BST (late Mar – late Oct, London = UTC+1) -> 0 13 * * 0
#   GMT (late Oct – late Mar, London = UTC+0) -> 0 14 * * 0
# Both are simply two ATTEMPTS at the same period. The runner no longer checks
# the clock at all: it asks whether this period's output already exists, and
# writes it if not. Whichever cron GitHub actually gets to first does the work;
# the other no-ops with reason=already-done.
#
# Do not "clean this up" to a single cron — that breaks half the year, and do not
# reintroduce an exact-hour guard: GitHub starts these jobs 30min-3h late, which
# silently disabled the whole engine until 2026-08-02. See runner.mjs `shouldRun`.
name: JARVIS Connection Finder

on:
  schedule:
    - cron: '0 13 * * 0'
    - cron: '0 14 * * 0'
  workflow_dispatch:
    inputs:
      force:
        description: 'Regenerate even if this period output already exists'
        required: false
        default: true
        type: boolean
      dry_run:
        description: 'No Groq call (plumbing test only)'
        required: false
        default: false
        type: boolean

jobs:
  connection-finder:
    uses: ./.github/workflows/_jarvis-run-skill.yml
    with:
      skill: connection-finder
      force: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
    secrets:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
