# JARVIS Skill 6 — Pattern Detector · Monday 08:00 Europe/London
# Fires at 07:00 and 08:00 UTC on Mondays; the runner's guard (Mon, 08:00
# London) admits exactly one, DST-correct year round. Rolls patterns.md
# (new section on top, ~20k of history retained below).
name: JARVIS 6 · Pattern Detector

on:
  schedule:
    - cron: '0 7,8 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: 'Run now, ignoring the Monday 08:00 London time guard'
        type: boolean
        default: true

jobs:
  pattern-detector:
    uses: ./.github/workflows/_jarvis-run-skill.yml
    secrets: inherit
    with:
      skill: pattern-detector
      force: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
