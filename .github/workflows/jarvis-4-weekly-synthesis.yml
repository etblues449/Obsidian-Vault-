# JARVIS Skill 4 — Weekly Synthesis · Friday 18:00 Europe/London
# Fires at 17:00 and 18:00 UTC on Fridays; the runner's guard (Fri, 18:00
# London) admits exactly one, DST-correct year round.
name: JARVIS 4 · Weekly Synthesis

on:
  schedule:
    - cron: '0 17,18 * * 5'
  workflow_dispatch:
    inputs:
      force:
        description: 'Run now, ignoring the Friday 18:00 London time guard'
        type: boolean
        default: true

jobs:
  weekly-synthesis:
    uses: ./.github/workflows/_jarvis-run-skill.yml
    secrets: inherit
    with:
      skill: weekly-synthesis
      force: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
